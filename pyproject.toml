[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwicalc"
version = "1.0.1"
description = "A comprehensive Python library for mathematical calculations, calculus, geometry, and plotting"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "KiwiCalc Developers" }
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "reportlab>=3.5.0",
    "anytree>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=5.0.0",
    "build>=1.2.1",
    "twine>=5.1.0",
]

[tool.setuptools.packages.find]
include = ["kiwicalc*"]

[tool.pytest.ini_options]
testpaths = ["testing"]
python_files = ["test_*.py"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]

[tool.coverage.run]
branch = true
source = ["kiwicalc"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
